name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # The release commit itself is pushed with GITHUB_TOKEN (which does not
    # trigger workflows) but guard anyway.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Next version
        id: version
        run: |
          next=$(scripts/next-version.sh)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ -z "$next" ]; then echo "No releasable commits since the last tag."; fi

      - name: Bump version
        if: steps.version.outputs.next != ''
        env:
          DEBFULLNAME: github-actions[bot]
          DEBEMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/set-version.sh "${{ steps.version.outputs.next }}"

      - name: Build .deb
        if: steps.version.outputs.next != ''
        # -d: Ubuntu's rustc is older than our MSRV; the toolchain comes from rustup.
        run: |
          dpkg-buildpackage -us -uc -b -d
          mkdir -p dist && mv ../pocketkey_*.deb dist/
          ls -l dist

      - name: Smoke-test the package
        if: steps.version.outputs.next != ''
        run: |
          sudo apt-get install -y ./dist/pocketkey_*.deb
          pocketkey --version
          dpkg -L pocketkey | grep -E 'bin/pocketkey|udev|modules-load|systemd/user'

      - name: Commit, tag and push
        if: steps.version.outputs.next != ''
        run: |
          v=${{ steps.version.outputs.next }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock debian/changelog
          git commit -m "chore(release): v$v [skip ci]"
          git tag -a "v$v" -m "pocketkey v$v"
          git push origin HEAD:main --follow-tags

      - name: GitHub release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.next }}
          gh release create "v$v" dist/pocketkey_*.deb --title "pocketkey v$v" --generate-notes
