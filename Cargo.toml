[package]
name = "hybridkey"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Virtual FIDO2 USB security key that proxies CTAP2 to a phone over the WebAuthn hybrid transport"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = "thin"
strip = true
