[package]
name = "pocketkey"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Virtual FIDO2 USB security key that proxies CTAP2 to a phone over the WebAuthn hybrid transport"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
ciborium = "0.2"
# rpIdHash for the local pre-flight answer; already a pxp dependency.
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# Hybrid transport (caBLE / PXP) from the libwebauthn project, pinned.
pxp = { git = "https://github.com/linux-credentials/libwebauthn", tag = "pxp-v0.1.0" }
# Only used to discover whether a Bluetooth adapter exists; already a pxp dependency.
btleplug = "0.11.7"
# Linked-device store file (serde is already a pxp dependency; ciborium encodes it).
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# UI: QR rendering and the egui window.
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
# Transitive dependency of btleplug/bluer; listed so the `vendored-dbus` feature can reach it.
dbus = "0.9"

[features]
default = []
# Build libdbus from source instead of linking the system library. For
# development machines without libdbus-1-dev; packages should not use it.
vendored-dbus = ["dbus/vendored"]

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = "thin"
strip = true
